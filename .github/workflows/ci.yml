# Continuous integration. What each job runs, and how to run the same checks
# locally, is described in docs/setup.md ("Continuous integration").
#
# Models, reference data and the NPU are not available on hosted runners: CI runs
# the `unit` and `ort` test labels, never `models`; the ARM64 job also runs the
# `npu` label and requires every one of those tests to report itself skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (validator, hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the hygiene check compares commits with origin/main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install jsonschema and pytest
        run: "python -m pip install --only-binary=:all: -r requirements-ci.txt"

      - name: Validator and tooling tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          scripts/tests/test_validate_results.py
          scripts/tests/test_check_hygiene.py
          scripts/tests/test_coverage_summary.py
          scripts/tests/test_manifests.py
          scripts/tests/test_export_models.py
          scripts/tests/test_model_recipes.py
          scripts/tests/test_references.py
          scripts/tests/test_accuracy_eval.py
          scripts/tests/test_timeseries.py
          scripts/tests/test_autoencoder.py
          scripts/tests/test_autoencoder_pipeline.py
          scripts/tests/test_anomaly_eval.py
          scripts/tests/test_doc_numbers.py
          scripts/tests/test_validate_doctor.py

      - name: Validate example and published results
        run: python scripts/validate_results.py --strict docs/examples benchmarks/results/published

      - name: Validate example doctor reports
        run: python scripts/validate_doctor.py docs/examples/doctor

      - name: Validate published accuracy results
        run: python scripts/validate_accuracy.py benchmarks/results/published/accuracy

      - name: Documented numbers match the published results
        run: python scripts/check_doc_numbers.py

      - name: Hygiene check
        run: python scripts/check_hygiene.py --base origin/main

  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msvc_arch: amd64
            configure_preset: x64
            preset: x64-release
            third_party: third_party/onnxruntime-x64
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            configure_preset: arm64-ninja
            preset: arm64-ninja-release
            third_party: |
              third_party/onnxruntime
              third_party/onnxruntime-qnn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      # The engine tests validate the result files they write with
      # scripts/validate_results.py, which needs jsonschema.
      - name: Python environment for result validation
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install --only-binary=:all: -r requirements-ci.txt
          "EDGEBENCH_CI_PYTHON=$env:RUNNER_TEMP\venv\Scripts\python.exe" >> $env:GITHUB_ENV

      - name: MSVC developer environment
        shell: pwsh
        run: ./scripts/msvc_dev_env.ps1 -Arch ${{ matrix.msvc_arch }}

      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.third_party }}
          key: third-party-${{ matrix.arch }}-${{ hashFiles('scripts/fetch_deps.ps1', 'cmake/bundle-pins.json') }}

      - name: Cache CMake downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_downloads
          key: fetchcontent-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**') }}

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch_deps.ps1 -Arch ${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }} -DEDGEBENCH_PYTHON="${{ env.EDGEBENCH_CI_PYTHON }}"

      - name: Build (/W4 /WX)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (unit, ort)
        run: ctest --preset ${{ matrix.preset }} -L "unit|ort" --output-on-failure --parallel 4

      # The hosted ARM64 runners have no Qualcomm hardware. Every `npu` test must
      # report itself as skipped there, with its reason in the log; one that passes
      # or fails on such a runner is a bug in the test's skip condition.
      - name: Test (npu, must skip without an NPU)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $lines = ctest --preset ${{ matrix.preset }} -L npu --no-tests=error --verbose --output-on-failure 2>&1
          $code = $LASTEXITCODE
          $lines | Write-Output
          if ($code -ne 0) { exit $code }
          $total = @($lines | Select-String -Pattern '^\s*\d+/\d+ Test\s+#\d+: ').Count
          $skipped = @($lines | Select-String -Pattern '^\s*\d+/\d+ Test\s+#\d+: .*\*\*\*Skipped').Count
          "npu tests: $skipped of $total skipped (no NPU on this runner)" >> $env:GITHUB_STEP_SUMMARY
          if ($total -eq 0 -or $skipped -ne $total) {
            Write-Error "expected every npu test to be skipped on a runner without an NPU: $skipped of $total skipped"
            exit 1
          }

      # The full doctor on a machine without an NPU: nothing may fail, the NPU
      # checks must come out not_applicable or warn, and the exit code must be 0.
      - name: Doctor (no failures on a runner)
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.configure_preset }}/bin/Release/edgebench.exe"
          $report = "$env:RUNNER_TEMP\doctor.json"
          & $exe doctor --json | Out-File -Encoding utf8 $report
          $code = $LASTEXITCODE
          Get-Content $report | Write-Output
          & $exe doctor --load-sample-ms 0
          & "${{ env.EDGEBENCH_CI_PYTHON }}" scripts/validate_doctor.py --runner $report
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($code -ne 0) { Write-Error "edgebench doctor exited with $code"; exit 1 }
          $statuses = (Get-Content $report -Raw | ConvertFrom-Json).checks |
            ForEach-Object { "$($_.name) $($_.status)" }
          "doctor: $($statuses -join ', ')" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-log-${{ matrix.arch }}
          path: build/${{ matrix.configure_preset }}/Testing/Temporary/
          if-no-files-found: ignore

  coverage:
    name: coverage (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENCPPCOVERAGE_VERSION: 0.9.9.0
      OPENCPPCOVERAGE_SHA256: 2295a733da39412c61e4f478677519dd0bb1893d88313ce56b468c9e50517888
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Python environment for result validation
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install --only-binary=:all: -r requirements-ci.txt
          "EDGEBENCH_CI_PYTHON=$env:RUNNER_TEMP\venv\Scripts\python.exe" >> $env:GITHUB_ENV

      - name: MSVC developer environment
        shell: pwsh
        run: ./scripts/msvc_dev_env.ps1 -Arch amd64

      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/onnxruntime-x64
          key: third-party-x64-${{ hashFiles('scripts/fetch_deps.ps1', 'cmake/bundle-pins.json') }}

      - name: Cache CMake downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_downloads
          key: fetchcontent-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**') }}

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch_deps.ps1 -Arch x64

      - name: Install OpenCppCoverage ${{ env.OPENCPPCOVERAGE_VERSION }}
        shell: pwsh
        run: |
          $v = $env:OPENCPPCOVERAGE_VERSION
          $installer = Join-Path $env:RUNNER_TEMP "OpenCppCoverageSetup-x64-$v.exe"
          Invoke-WebRequest -UseBasicParsing -OutFile $installer `
            -Uri "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-$v/OpenCppCoverageSetup-x64-$v.exe"
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:OPENCPPCOVERAGE_SHA256) { throw "SHA256 mismatch: $actual" }
          Start-Process -Wait -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake --preset x64 -DEDGEBENCH_PYTHON="${{ env.EDGEBENCH_CI_PYTHON }}"

      - name: Build (Debug)
        run: cmake --build --preset x64-debug

      # Coverage of engine/src from every test program and every child process
      # they start (edgebench.exe, the helpers). No threshold: report only.
      # ExitPaths.UnhandledExceptionIsReportedAndExits1 is excluded here (it runs
      # in the windows jobs): OpenCppCoverage is a debugger, and Windows passes an
      # unhandled exception to the debugger instead of the process's own filter.
      - name: Test (unit, ort) under OpenCppCoverage
        shell: pwsh
        run: |
          OpenCppCoverage.exe --quiet --cover_children `
            --sources "$env:GITHUB_WORKSPACE\engine\src" `
            --modules "$env:GITHUB_WORKSPACE\build\x64" `
            --export_type "html:coverage\html" `
            --export_type "cobertura:coverage\coverage.xml" `
            -- ctest --preset x64-debug -L "unit|ort" --output-on-failure `
               -E "^ExitPaths\.UnhandledExceptionIsReportedAndExits1$"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Warning "ctest under OpenCppCoverage exited with $code" }
          exit $code

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $table = python scripts/coverage_summary.py coverage/coverage.xml --prefix engine/src
          $table
          "## Line coverage, engine/src (unit + ort tests, x64 Debug)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          $table >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-x64
          path: coverage/
          if-no-files-found: warn
